</sc-for>
<div style="height: 1px; background: #EFE9E1; margin: 10px 14px"></div>
<sc-for list="{{secondary}}" as="item" hint-placeholder-count="3">
<a href="{{item.href}}" aria-current="{{item.current}}" style="display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 14px; border-radius: 24px; background: {{item.bg}}; color: {{item.fg}}; font-size: 14px; font-weight: {{item.weight}}; text-decoration: none">
