<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meal plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#177A50;text-decoration:none}a:hover{color:#136A45}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F3EE; font-family: 'Manrope', system-ui, sans-serif; color: #1E1B18; display: flex; flex-direction: column; overflow: hidden; position: relative">
<div style="flex-grow: 1; padding: 16px 18px 10px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; align-items: center; gap: 4px">
<button onClick="{{openMenu}}" aria-label="Open menu" style="width: 44px; height: 44px; margin-left: -10px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E1B18" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Plan</h1>
</div>
<div style="display: flex; align-items: center">
<button aria-label="Previous week" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E1B18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
<span style="font-size: 13px; font-weight: 600">23 – 29 Nov</span>
<button aria-label="Next week" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E1B18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
</div>
</div>

<div role="tablist" aria-label="Days" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<button role="tab" aria-selected="{{d.selected}}" onClick="{{d.pick}}" style="border: 1px solid {{d.border}}; background: {{d.bg}}; border-radius: 16px; padding: 7px 0 8px; font: inherit; color: #1E1B18; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 64px">
<span style="font-size: 11px; color: #776E65">{{d.dow}}</span>
<span style="font-size: 15px; font-weight: 700">{{d.num}}</span>
<span style="width: 26px; height: 4px; border-radius: 2px; background: #EFE9E1; overflow: hidden; display: flex"><span style="width: {{d.fill}}; background: {{d.fillColor}}"></span></span>
</button>
</sc-for>
</div>

<section style="background: #FFFFFF; border: 1px solid #F1ECE5; box-shadow: 0 1px 2px rgba(40,30,20,0.04); border-radius: 22px; padding: 12px 16px 2px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 13px; color: #776E65">Planned <span style="font-family: 'Manrope', sans-serif; font-size: 20px; font-weight: 700; color: #1E1B18">{{planned}}</span> / 2,450 kcal</span>
<span style="font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: {{statusBg}}; color: {{statusColor}}">{{status}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 16px; row-gap: 8px; font-size: 12px; color: #776E65">
<sc-for list="{{macros}}" as="m" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 4px">
<span><span style="font-weight: 700; color: {{m.color}}">{{m.name}}</span> <span style="font-family: 'Manrope', sans-serif; color: {{m.valColor}}">{{m.val}}</span> <span style="font-family: 'Manrope', sans-serif">{{m.range}}</span></span>
<span style="position: relative; height: 5px; border-radius: 3px; background: #EFE9E1; display: block; overflow: hidden"><span style="position: absolute; top: 0; bottom: 0; left: {{m.bandL}}; width: {{m.bandW}}; background: {{m.band}}"></span><span style="position: absolute; top: 0; bottom: 0; left: 0; width: {{m.pct}}; background: {{m.color}}; border-radius: 3px"></span></span>
</div>
</sc-for>
</div>
<dc-import name="Micros" variant="day" framed="{{ false }}" hint-size="100%,40px"></dc-import>
</section>

<section style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{meals}}" as="meal" hint-placeholder-count="4">
<div style="background: #FFFFFF; border: 1px solid #F1ECE5; box-shadow: 0 1px 2px rgba(40,30,20,0.04); border-radius: 16px; padding: 9px 6px 9px 14px; display: flex; align-items: center; gap: 6px">
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 12px; color: #776E65; white-space: nowrap">{{meal.slot}}<sc-if value="{{meal.hasMacros}}" hint-placeholder-val="{{ true }}"><span style="font-family: 'Manrope', sans-serif; display: inline-flex; gap: 6px; margin-left: 6px"><span style="color: #4F46E5">P {{meal.p}}</span><span style="color: #EA6A2A">F {{meal.f}}</span><span style="color: #22A06B">C {{meal.c}}</span><span style="color: #A27B2C">Fib {{meal.fib}}</span></span></sc-if></span>
<span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{meal.items}}</span>
</div>
<span style="font-family: 'Manrope', sans-serif; font-size: 13px; white-space: nowrap">{{meal.kcal}}</span>
<a href="AddFood.dc.html" aria-label="Edit {{meal.slot}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #776E65">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></a>
</div>
</sc-for>
</section>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button style="min-height: 44px; border-radius: 16px; border: 1px solid #DED6CB; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #1E1B18">Copy day</button>
<button style="min-height: 44px; border-radius: 16px; border: 1px solid #DED6CB; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #1E1B18">Use template</button>
<button style="min-height: 44px; border-radius: 16px; border: 1px solid #22A06B; background: #E6F5EC; font: inherit; font-size: 13px; font-weight: 600; color: #136A45">Shopping list</button>
</div>
</div>


<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; z-index: 10">
<dc-import name="NavDrawer" active="Meal plan" hint-size="300px,844px"></dc-import>
<button onClick="{{closeMenu}}" aria-label="Close menu" style="flex-grow: 1; border: none; background: rgba(23,25,27,0.42)"></button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { day: 4 }; }
  renderVals() {
    const sel = this.state.day;
    const plans = [
      { fib: 32, kcal: 2440, p: 150, c: 335, f: 60, meals: [['Breakfast', 'Overnight oats', 410], ['Lunch', 'Lentil curry, rice (leftovers)', 720], ['Dinner', 'Salmon, potatoes, broccoli', 760], ['Snacks', 'Skyr + berries, protein shake', 550]] },
      { fib: 27, kcal: 2460, p: 147, c: 345, f: 56, meals: [['Breakfast', 'Overnight oats', 410], ['Lunch', 'Chicken wrap, apple', 690], ['Dinner', 'Pasta bolognese', 810], ['Snacks', 'Skyr + berries, protein shake', 550]] },
      { fib: 29, kcal: 2430, p: 152, c: 330, f: 59, meals: [['Breakfast', 'Overnight oats', 410], ['Lunch', 'Chicken wrap, apple', 690], ['Dinner', 'Lentil curry, rice', 780], ['Snacks', 'Skyr + berries, protein shake', 550]] },
      { fib: 31, kcal: 2450, p: 149, c: 340, f: 58, meals: [['Breakfast', 'Overnight oats', 410], ['Lunch', 'Lentil curry, rice (leftovers)', 720], ['Dinner', 'Turkey burger, salad', 770], ['Snacks', 'Skyr + berries, protein shake', 550]] },
      { fib: 26, kcal: 2430, p: 152, c: 335, f: 58, meals: [['Breakfast', 'Skyr, oats, banana', 520], ['Lunch', 'Chicken wrap, apple', 690], ['Dinner', 'Lentil curry, rice', 780], ['Snacks', 'Protein shake, rice cakes', 440]] },
      { fib: 14, kcal: 1610, p: 98, c: 215, f: 40, meals: [['Breakfast', 'Pancakes with quark', 620], ['Lunch', 'Not planned yet', 0], ['Dinner', 'Pizza night', 990], ['Snacks', 'Not planned yet', 0]] },
      { fib: 0, kcal: 0, p: 0, c: 0, f: 0, meals: [['Breakfast', 'Not planned yet', 0], ['Lunch', 'Not planned yet', 0], ['Dinner', 'Not planned yet', 0], ['Snacks', 'Not planned yet', 0]] }
    ];
    const dows = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const p = plans[sel];
    const ratio = p.kcal / 2450;
    const ok = ratio > 0.95 && ratio < 1.05;
    const pct = (v, g) => Math.min(100, Math.round(v / g * 100)) + '%';
    return {
      menuOpen: !!this.state.menu, openMenu: () => this.setState({ menu: true }), closeMenu: () => this.setState({ menu: false }),
      days: dows.map((dow, i) => {
        const r = plans[i].kcal / 2450;
        return {
          dow, num: String(23 + i), selected: i === sel ? 'true' : 'false',
          bg: i === sel ? '#E6F5EC' : '#FFFFFF', border: i === sel ? '#22A06B' : '#EFE9E1',
          fill: Math.min(100, Math.round(r * 100)) + '%',
          fillColor: r > 0.95 && r < 1.05 ? '#22A06B' : '#EA6A2A',
          pick: () => this.setState({ day: i })
        };
      }),
      barDay: dows[sel] + ' ' + (23 + sel),
      planned: p.kcal.toLocaleString('en-US'),
      status: p.kcal === 0 ? 'Empty' : ok ? 'Fits target' : (2450 - p.kcal).toLocaleString('en-US') + ' kcal open',
      statusBg: ok ? '#E6F5EC' : '#FBEBDD', statusColor: ok ? '#136A45' : '#9A3412',
      macros: [
        ['Protein', p.p, 141, 157, '#4F46E5', '#C7C9F7'],
        ['Fat', p.f, 39, 63, '#EA6A2A', '#F8CDB4'],
        ['Carbs', p.c, Math.max(0, Math.round((2340 - p.p * 4 - p.f * 9) / 4)), Math.max(0, Math.round((2550 - p.p * 4 - p.f * 9) / 4)), '#22A06B', '#B9E5CD'],
        ['Fiber', p.fib, 30, null, '#A27B2C', '#E9D7AE']
      ].map(([name, val, lo, hi, color, band]) => {
        const max = hi === null ? lo * 1.6 : hi * 1.3;
        const pc = (v) => Math.min(100, v / max * 100).toFixed(1) + '%';
        const inRange = val >= lo && (hi === null || val <= hi);
        const bw = hi === null ? 100 - lo / max * 100 : (hi - lo) / max * 100;
        return { name, val, range: hi === null ? '≥' + lo : lo + '–' + hi, color, band, valColor: inRange ? '#136A45' : '#9A3412', pct: pc(val), bandL: pc(lo), bandW: bw.toFixed(1) + '%' };
      }),
      meals: p.meals.map(([slot, items, k]) => ({ slot, items, kcal: k ? String(k) : '+ add', hasMacros: k > 0, p: Math.round(k * 0.24 / 4), f: Math.round(k * 0.24 / 9), c: Math.round(k * 0.52 / 4), fib: Math.round(k / 100) }))
    };
  }
}
</script>
</body>
</html>
