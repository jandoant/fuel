<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recipes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#177A50;text-decoration:none}a:hover{color:#136A45}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F3EE; font-family: 'Manrope', system-ui, sans-serif; color: #1E1B18; display: flex; flex-direction: column; overflow: hidden; position: relative">
<div style="flex-grow: 1; min-height: 0; padding: 16px 18px 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 4px">
<button onClick="{{openMenu}}" aria-label="Open menu" style="width: 44px; height: 44px; margin-left: -10px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E1B18" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Recipes</h1>
</div>
<a href="RecipeDetail.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 10px; background: #F1EBFC; color: #7048C7; font-size: 13px; font-weight: 700">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7048C7" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New recipe</a>
</div>

<label style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #DED6CB; border-radius: 16px; padding: 0 12px; height: 46px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#776E65" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search recipes</span>
<input type="search" placeholder="Search recipes or ingredients" style="border: none; outline: none; font: inherit; font-size: 15px; flex-grow: 1; background: transparent; color: #1E1B18">
</label>

<div role="tablist" aria-label="Filter" style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button role="tab" aria-selected="{{f.selected}}" onClick="{{f.pick}}" style="min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid {{f.border}}; background: {{f.bg}}; font: inherit; font-size: 13px; font-weight: {{f.weight}}; color: #1E1B18">{{f.label}}</button>
</sc-for>
</div>

<div style="flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 18px">
<sc-for list="{{recipes}}" as="r" hint-placeholder-count="6">
<a href="RecipeDetail.dc.html" style="background: #FFFFFF; border: 1px solid #F1ECE5; box-shadow: 0 1px 2px rgba(40,30,20,0.04); border-radius: 18px; padding: 12px; display: flex; gap: 12px; align-items: center; color: #1E1B18">
<span style="width: 40px; height: 40px; border-radius: 10px; background: #F1EBFC; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7048C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h16v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM2 10h20M9 3v3M15 3v3M12 2v4"/></svg></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><span style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span><sc-if value="{{r.fav}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="#C98A1B" stroke="#C98A1B" stroke-width="1.5" stroke-linejoin="round" role="img" aria-label="Favorite" style="flex-shrink: 0"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg></sc-if></span>
<span style="font-size: 12px; color: #776E65">{{r.meta}}</span>
<span style="font-family: 'Manrope', sans-serif; font-size: 11px; display: flex; gap: 6px; flex-wrap: wrap"><span style="color: #1E1B18; font-weight: 700">{{r.kcal}} kcal</span><span style="color: #4F46E5">P {{r.p}}</span><span style="color: #EA6A2A">F {{r.f}}</span><span style="color: #22A06B">C {{r.c}}</span><span style="color: #A27B2C">Fib {{r.fib}}</span></span>
</span>
</a>
</sc-for>
</div>
</div>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; z-index: 10">
<dc-import name="NavDrawer" active="Recipes" hint-size="300px,844px"></dc-import>
<button onClick="{{closeMenu}}" aria-label="Close menu" style="flex-grow: 1; border: none; background: rgba(23,25,27,0.42)"></button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { menu: false, filter: 'All' }; }
  renderVals() {
    const s = this.state;
    const all = [
      { name: 'Lentil coconut curry', tags: ['Main'], fav: true, meta: '5 ingredients · used 3× this month', kcal: 524, p: 25, f: 23, c: 55, fib: 13 },
      { name: 'Overnight oats', tags: ['Breakfast'], fav: true, meta: '5 ingredients · used 18× this month', kcal: 460, p: 30, f: 13, c: 55, fib: 7 },
      { name: 'Chicken wrap', tags: ['Main'], fav: false, meta: '5 ingredients · used 9× this month', kcal: 528, p: 56, f: 15, c: 38, fib: 7 },
      { name: 'Protein shake', tags: ['Snack'], fav: true, meta: '3 ingredients · used 21× this month', kcal: 243, p: 33, f: 6, c: 15, fib: 2 },
      { name: 'Spaghetti bolognese', tags: ['Main'], fav: false, meta: '8 ingredients · used 2× this month', kcal: 870, p: 42, f: 28, c: 105, fib: 8 },
      { name: 'Salmon, potatoes, broccoli', tags: ['Main'], fav: false, meta: '4 ingredients · used 4× this month', kcal: 760, p: 45, f: 34, c: 62, fib: 9 }
    ];
    const list = s.filter === 'All' ? all : s.filter === 'Favorites' ? all.filter((r) => r.fav) : all.filter((r) => r.tags.indexOf(s.filter) >= 0);
    return {
      menuOpen: !!s.menu, openMenu: () => this.setState({ menu: true }), closeMenu: () => this.setState({ menu: false }),
      filters: ['All', 'Favorites', 'Breakfast', 'Main', 'Snack'].map((label) => ({
        label, selected: label === s.filter ? 'true' : 'false',
        bg: label === s.filter ? '#F1EBFC' : '#FFFFFF', border: label === s.filter ? '#7048C7' : '#DED6CB',
        weight: label === s.filter ? '600' : '500', pick: () => this.setState({ filter: label })
      })),
      recipes: list
    };
  }
}
</script>
</body>
</html>
