<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today – Dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1012; font-family: 'Inter', system-ui, sans-serif; color: #F3F5F4; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 16px 18px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px">
<button aria-label="Open menu" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #23272B; background: #171A1D; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3F5F4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
<div style="flex-grow: 1; display: flex; flex-direction: column">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.02em">Today</span>
<span style="font-size: 12px; color: #8E9894">Thu, 26 Nov</span>
</div>
<a href="#" style="display: flex; flex-direction: column; align-items: flex-end">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600">78.4 kg</span>
<span style="font-size: 11px; color: #D7F25C">↓ 0.3 kg/wk</span>
</a>
</div>

<section style="background: #171A1D; border: 1px solid #23272B; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column">
<span style="font-size: 12px; color: #8E9894; letter-spacing: 0.04em">CALORIES LEFT</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; color: #D7F25C">1,260</span>
</div>
<span style="font-size: 12px; font-weight: 600; color: #0E1012; background: #D7F25C; padding: 5px 10px; border-radius: 999px; margin-bottom: 6px">Plan fits</span>
</div>
<div style="position: relative; height: 14px; border-radius: 7px; background: #23272B; overflow: hidden">
<div style="position: absolute; top: 0; bottom: 0; left: 42.5%; width: 41.6%; background: rgba(215,242,92,0.32)"></div>
<div style="position: absolute; top: 0; bottom: 0; left: 0; width: 42.5%; background: #D7F25C; border-radius: 7px"></div>
<div style="position: absolute; top: 0; bottom: 0; left: 83.6%; width: 7.5%; background: repeating-linear-gradient(135deg, rgba(255,255,255,0.85) 0 1.5px, rgba(255,255,255,0.08) 1.5px 5px)"></div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #8E9894">Eaten</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600">1,190</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #8E9894">Planned</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600; color: #B9CF55">+1,165</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #8E9894">Goal</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600">2,340–2,550</span></div>
</div>
</section>

<section style="background: #171A1D; border: 1px solid #23272B; border-radius: 22px; padding: 14px 12px 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{macros}}" as="m" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="position: relative; width: 40px; height: 96px; border-radius: 12px; background: #23272B; overflow: hidden">
<div style="position: absolute; left: 0; right: 0; bottom: {{m.eatH}}; height: {{m.planH}}; background: {{m.soft}}"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{m.eatH}}; background: {{m.color}}"></div>
<div style="position: absolute; left: 0; right: 0; bottom: {{m.zoneB}}; height: {{m.zoneH}}; background: repeating-linear-gradient(135deg, rgba(255,255,255,0.85) 0 1.5px, rgba(255,255,255,0.06) 1.5px 5px)"></div>
</div>
<span style="font-size: 11px; color: {{m.color}}; font-weight: 600">{{m.name}}</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; line-height: 1">{{m.eaten}}<span style="font-size: 11px; color: #8E9894">g</span></span>
<span style="font-size: 11px; color: #8E9894">+{{m.rest}} · {{m.goal}}</span>
<span style="font-size: 10px; font-weight: 600; color: {{m.statusInk}}">{{m.status}}</span>
</div>
</sc-for>
</section>
</div>

<div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px 18px 20px">
<sc-for list="{{meals}}" as="ml" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 22px minmax(0, 1fr); column-gap: 12px">
<div style="display: flex; flex-direction: column; align-items: center">
<span style="width: 12px; height: 12px; border-radius: 6px; border: 2px solid {{ml.node}}; background: {{ml.nodeFill}}; margin-top: 4px; box-sizing: border-box"></span>
<span style="flex-grow: 1; width: 2px; background: #23272B; margin-top: 4px"></span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-bottom: 16px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600">{{ml.name}}</span>
<span style="font-size: 12px; color: #8E9894">{{ml.kcal}} kcal</span>
</div>
<sc-for list="{{ml.items}}" as="it" hint-placeholder-count="2">
<div style="background: {{it.bg}}; border: 1px {{it.borderStyle}} {{it.border}}; border-radius: 14px; padding: 9px 12px; display: flex; align-items: center; gap: 10px">
<span style="width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid {{it.checkBorder}}; background: {{it.checkBg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-sizing: border-box"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{it.checkInk}}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="display: flex; align-items: center; gap: 6px"><span style="font-size: 14px; font-weight: 500; color: {{it.nameInk}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.name}}</span><sc-if value="{{it.recipe}}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#B49CF2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Recipe" style="flex-shrink: 0"><path d="M4 10h16v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM2 10h20M12 3v4"/></svg></sc-if></span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 11px; display: flex; gap: 8px; color: #8E9894">{{it.amount}}<span style="color: #8CB4FF">P{{it.p}}</span><span style="color: #FF9F6B">F{{it.f}}</span><span style="color: #5ED6B4">C{{it.c}}</span><span style="color: #E0C27A">Fib{{it.fib}}</span></span>
</div>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600">{{it.kcal}}</span>
</div>
</sc-for>
<a href="#" style="border-radius: 14px; border: 1px dashed #2E3337; padding: 9px 12px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #8E9894">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D7F25C" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add to {{ml.lower}}</span></a>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pct = (v, m) => Math.min(100, v / m * 100).toFixed(1) + '%';
    const mac = (name, eaten, rest, lo, hi, color, soft, status, warn) => {
      const m = hi ? hi * 1.3 : lo * 1.6;
      return { name, eaten, rest, color, soft, status, statusInk: warn ? '#FF8A5B' : '#D7F25C',
        eatH: pct(eaten, m), planH: pct(rest, m), zoneB: pct(lo, m), zoneH: (((hi ? hi : m) - lo) / m * 100).toFixed(1) + '%',
        goal: hi ? lo + '–' + hi : '≥' + lo };
    };
    const item = (name, amount, kcal, p, f, c, fib, done, recipe) => ({ name, amount, kcal, p, f, c, fib, recipe,
      bg: done ? '#171A1D' : 'transparent', border: done ? '#23272B' : '#2E3337', borderStyle: done ? 'solid' : 'dashed',
      nameInk: done ? '#F3F5F4' : '#C4CBC8',
      checkBg: done ? '#D7F25C' : 'transparent', checkBorder: done ? '#D7F25C' : '#4A5156', checkInk: done ? '#0E1012' : 'transparent' });
    return {
      macros: [
        mac('Protein', 70, 88, 141, 157, '#8CB4FF', 'rgba(140,180,255,0.32)', '1 g over', true),
        mac('Fat', 28, 27, 39, 63, '#FF9F6B', 'rgba(255,159,107,0.32)', 'fits', false),
        mac('Carbs', 147, 158, 303, 356, '#5ED6B4', 'rgba(94,214,180,0.32)', 'fits', false),
        mac('Fiber', 24, 15, 30, null, '#E0C27A', 'rgba(224,194,122,0.32)', 'fits', false)
      ],
      meals: [
        { name: 'Breakfast', lower: 'breakfast', kcal: 567, node: '#D7F25C', nodeFill: '#D7F25C', items: [item('Overnight oats', '1 jar', 460, 30, 13, 55, 7, true, true), item('Banana', '1 medium', 107, 1, 0, 27, 3, true, false)] },
        { name: 'Lunch', lower: 'lunch', kcal: 622, node: '#D7F25C', nodeFill: '#D7F25C', items: [item('Chicken wrap', '1 wrap', 528, 56, 15, 38, 7, true, true), item('Apple', '1 medium', 94, 1, 0, 25, 4, true, false)] },
        { name: 'Dinner', lower: 'dinner', kcal: 784, node: '#4A5156', nodeFill: '#0E1012', items: [item('Lentil coconut curry', '1 serving', 524, 25, 23, 55, 13, false, true), item('Basmati rice', '200 g', 260, 5, 1, 56, 1, false, false)] },
        { name: 'Snacks', lower: 'snacks', kcal: 383, node: '#4A5156', nodeFill: '#0E1012', items: [item('Protein shake', '1 serving', 243, 33, 6, 15, 2, false, true), item('Rice cakes', '4 pieces', 140, 3, 1, 30, 1, false, false)] }
      ]
    };
  }
}
</script>
</body>
</html>
